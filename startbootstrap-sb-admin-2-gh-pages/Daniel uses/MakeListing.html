<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Create Listing</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">

    <link href="css/sb-admin-2.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body { background-color: #f8f9fc; }
        .hero { background: linear-gradient(135deg, #4e73df 0%, #224abe 100%); }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark hero shadow mb-4">
    <a class="navbar-brand font-weight-bold ml-3" href="mainpage.html"></a>
    <button class="navbar-toggler mr-2" type="button" data-toggle="collapse" data-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ml-auto mr-3">
            <li class="nav-item"><a class="nav-link" href="mainpage.html"><i class="fas fa-list mr-1"></i>Browse</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html"><i class="fas fa-user mr-1"></i>Log out</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <h4 class="font-weight-bold mb-4 text-center text-primary">Create a Listing</h4>

                    <form>
                        <div class="form-group">
                            <label>Item Title</label>
                            <input type="text" class="form-control" placeholder="e.g. Math Textbook">
                        </div>

                        <div class="form-group">
                            <label>Category</label>
                            <select class="form-control">
                                <option>Uniforms</option>
                                <option>Textbooks</option>
                                <option>Stationery</option>
                                <option>Sport</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>School</label>
                            <input type="text" class="form-control" placeholder="e.g. ... High school">
                        </div>

                        <div class="form-group">
                            <label>Condition</label>
                            <select class="form-control">
                                <option>Like New</option>
                                <option>Good</option>
                                <option>Fair</option>
                                <option>Used</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Price in rands (R)</label>
                            <input type="number" class="form-control" placeholder="e.g. 100">
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control" rows="3" placeholder="Enter description"></textarea>
                        </div>

                        <a href="mainpage.html" class="btn btn-primary btn-block">Post Listing</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
